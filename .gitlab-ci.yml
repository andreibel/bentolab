stages:
  - test
  - docker-build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  REGISTRY: $CI_REGISTRY_IMAGE

default:
  interruptible: true

# ─── PATH FILTERS (anchors reused in rules: changes:) ─────────────────────────
.backend-paths: &backend-paths
  - backend/**/*
  - .gitlab-ci.yml

.frontend-paths: &frontend-paths
  - frontend/**/*
  - .gitlab-ci.yml

# ─── TEST STAGE ───────────────────────────────────────────────────────────────
backend-test:
  stage: test
  image: bellsoft/liberica-openjdk-alpine:25-cds
  rules:
    - if: $CI_COMMIT_TAG
      changes: *backend-paths
    - if: $CI_COMMIT_BRANCH
      changes: *backend-paths
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/
  script:
    - cd backend
    - chmod +x gradlew
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    reports:
      junit:
        - backend/**/build/test-results/test/TEST-*.xml
    paths:
      - backend/**/build/reports/tests/
      - backend/**/build/reports/jacoco/
    expire_in: 7 days

frontend-lint:
  stage: test
  image: node:24-alpine
  rules:
    - if: $CI_COMMIT_TAG
      changes: *frontend-paths
    - if: $CI_COMMIT_BRANCH
      changes: *frontend-paths
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint

# ─── DOCKER BUILD STAGE ───────────────────────────────────────────────────────
build-backend-image:
  stage: docker-build
  # Runs on the Mac SHELL runner → builds against the Mac's own Docker
  # (native arm64, no dind). image:/services: are intentionally omitted.
  tags:
    - local-mac
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_TAG
      changes: *backend-paths
    - if: $CI_COMMIT_BRANCH
      changes: *backend-paths
  cache:
    key: docker-layer-cache
    paths:
      - .docker-cache/
  parallel:
    matrix:
      - SERVICE:
          - api-gateway
          - auth-service
          - org-service
          - board-service
          - task-service
          - notification-service
          - realtime-service
          - attachment-service
  script:
    - |
      IMAGE_NAME="$REGISTRY/$SERVICE"
      docker build \
        --cache-from "$IMAGE_NAME:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -f backend/$SERVICE/Dockerfile \
        -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        backend/
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi

build-frontend-image:
  stage: docker-build
  # Runs on the Mac SHELL runner → builds against the Mac's own Docker.
  tags:
    - local-mac
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_TAG
      changes: *frontend-paths
    - if: $CI_COMMIT_BRANCH
      changes: *frontend-paths
  script:
    - |
      IMAGE_NAME="$REGISTRY/frontend"
      docker build \
        --cache-from "$IMAGE_NAME:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        frontend/
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      elif [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi

# ─── DEPLOY STAGE ─────────────────────────────────────────────────────────────
deploy-pi5:
  stage: deploy
  # CHANGE 2: deploy runs on the Pi's SHELL runner, so it must NOT inherit
  # .docker-base (the docker:27 image + dind service). A shell runner talks to
  # the Pi's real Docker directly. We keep ONLY the registry login it needs.
  tags:
    - pi
  # CHANGE 3: don't let a newer pipeline cancel a deploy mid-flight.
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml
  needs:
    - job: build-backend-image
      optional: true
    - job: build-frontend-image
      optional: true
  variables:
    BENTO_IMAGE_PREFIX: "$CI_REGISTRY_IMAGE/"
    BENTO_TAG: "$CI_COMMIT_SHORT_SHA"
    COMPOSE_FILE: "$CI_PROJECT_DIR/docker-compose.beta.yml"
    # Stable project name so containers/volumes are consistent across runs,
    # regardless of the runner's per-pipeline checkout path.
    COMPOSE_PROJECT_NAME: "bento"
    # CHANGE 4: secrets live in a persistent .env ON THE PI (not in git, not in
    # GitLab variables). Dynamic image vars above come from the job env and
    # OVERRIDE the file; the file supplies DB/JWT/SES secrets.
    ENV_FILE: "/opt/bento/.env"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull
    - docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans
    - docker image prune -f
